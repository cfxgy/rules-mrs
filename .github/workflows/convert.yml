name: Convert Loyalsoldier Domain Rules to MRS

on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run convert script
        run: |
          chmod +x scripts/convert.sh
          ./scripts/convert.sh

      - name: Commit and push to release branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B release
          git add mrs/
          git commit -m "Update MRS rules $(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M')" || echo "No changes"
          git push origin release --force

      - name: Get Beijing time
        id: time
        run: |
          echo "stamp=$(TZ=Asia/Shanghai date +'%Y%m%d%H%M')" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.time.outputs.stamp }}
          name: ${{ steps.time.outputs.stamp }}
          body: |
            自动转换自 Loyalsoldier/clash-rules
            生成时间（北京时间）: ${{ steps.time.outputs.stamp }}
          files: |
            mrs/*.mrs
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
