name: Convert Loyalsoldier Domain Rules to MRS

on:
  schedule:
    - cron: '0 18 * * *'   # 北京时间约 02:00
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run convert script
        run: |
          chmod +x scripts/convert.sh
          ./scripts/convert.sh

      - name: Commit and push to release branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B release
          git add mrs/
          git commit -m "Update MRS rules $(date -u +'%Y-%m-%d %H:%M UTC')" || echo "No changes"
          git push origin release --force

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mrs-${{ github.run_number }}
          name: MRS Rules ${{ github.run_number }}
          body: |
            自动转换自 Loyalsoldier/clash-rules
            更新时间: ${{ github.event.head_commit.timestamp || 'scheduled' }}
          files: |
            mrs/*.mrs
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
