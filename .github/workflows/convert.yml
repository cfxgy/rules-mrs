name: Convert Loyalsoldier Domain Rules to MRS

on:
  schedule:
    # 每天北京时间 02:00 自动运行（UTC 18:00）
    - cron: '0 18 * * *'
  workflow_dispatch:  # 允许手动触发

jobs:
  convert:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 必须有写权限才能推送

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run convert script
        run: |
          chmod +x scripts/convert.sh
          ./scripts/convert.sh

      - name: Commit and push to release branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # 切换到 release 分支（不存在则创建）
          git checkout -B release
          
          # 只提交 mrs 目录
          git add mrs/
          git commit -m "Update MRS rules $(date +'%Y-%m-%d %H:%M')" || echo "没有变化，跳过提交"
          git push origin release --force
